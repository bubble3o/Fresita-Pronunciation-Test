<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fresita 🍓 发音实验室</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#653b50;background:#fff5f8}body{margin:0;padding:22px 16px 65px}.wrap{max-width:650px;margin:auto}h1{font-size:29px;margin:14px 0 4px}.sub{color:#9c6a7e;line-height:1.6}.card{background:white;border:1px solid #f8d6e2;border-radius:22px;padding:20px;margin:17px 0;box-shadow:0 6px 22px #edb8c323}label{display:block;font-weight:700;margin:15px 0 7px}select,input,textarea{box-sizing:border-box;width:100%;border:1px solid #e9b7c9;background:#fffafd;color:#5d3449;border-radius:12px;padding:12px;font-size:16px}textarea{min-height:76px}button{border:0;border-radius:13px;background:#e85e91;color:white;padding:13px 16px;font-size:15px;font-weight:700;cursor:pointer}button.secondary{background:#fae2eb;color:#9c345c}button:disabled{opacity:.55}.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.row button{flex:1;min-width:105px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.chips button{background:#fff1f6;color:#b64b72;border:1px solid #f4c8d8;padding:9px 11px;font-weight:500}.hint{font-size:13px;color:#9a6b7c;line-height:1.7}.status{background:#fff0f5;border-radius:12px;padding:12px;min-height:23px;line-height:1.5}.tag{font-size:12px;background:#ffe1eb;border-radius:8px;padding:4px 7px}strong{color:#a83867}</style></head><body><div class="wrap"><h1>Fresita 🍓 发音实验室</h1><p class="sub">独立测试页面，不读取或修改 Fresita 的学习记录。对比西班牙与拉美语音，找出 iPhone 上更自然的声音。</p><div class="card"><label for="region">🌍 口音</label><select id="region"><option value="es-ES">🇪🇸 España · 西班牙</option><option value="es-MX">🇲🇽 México · 拉美代表</option></select><label for="voice">🎙️ 设备上的西语声音</label><select id="voice"><option>正在查找语音…</option></select><div class="row"><button class="secondary" id="refresh">🔄 重新检测声音</button></div><p class="hint" id="voiceInfo">iPhone 上可用声音取决于系统安装情况；口音切换不能凭空增加语音包。</p><label for="rate">🐢 语速 <span id="rateValue">1.00×</span></label><input id="rate" type="range" min="0.75" max="1.10" step="0.05" value="1"><label for="phrase">✏️ 测试内容</label><textarea id="phrase" spellcheck="false">Me gustaría escuchar música esta noche.</textarea><div class="chips"><button data-phrase="gracias">gracias</button><button data-phrase="miércoles">miércoles</button><button data-phrase="el árbol">el árbol</button><button data-phrase="Me gustaría escuchar música esta noche.">完整句子</button><button data-phrase="¿Dónde está la estación de tren?">问句</button><button data-phrase="Quiero una taza de café, por favor.">咖啡店</button></div><div class="row"><button id="play">🔊 播放</button><button id="slow">🐢 慢速试听</button><button class="secondary" id="stop">■ 停止</button></div></div><div class="card"><strong>📋 播放状态</strong><p class="status" id="status" aria-live="polite">点击「播放」开始试听。</p><p class="hint">建议用同一句话分别试听两种口音和不同声音。若设备没有对应语音，会显示提示，不会假装已经切换成功。iOS Safari 的语音列表有时需要等待或再次点击「重新检测声音」。</p></div><div class="card"><strong>💕 听感小记录</strong><p class="hint">可以先记下你最喜欢的声音名称、口音和语速，之后我们再整合到 Fresita。这里不会上传录音，也不调用付费服务。</p><textarea id="notes" placeholder="例如：西班牙声音 A 比较自然，0.95× 最舒服…"></textarea><div class="row"><button class="secondary" id="copy">复制测试结果</button></div></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),synth=window.speechSynthesis;let voices=[],timer;const region=$('region'),voice=$('voice'),rate=$('rate'),status=$('status');function sayStatus(t){status.textContent=t}function matching(v,lang){return v.lang.toLowerCase().replace('_','-')===lang.toLowerCase()}function refresh(){if(!synth){sayStatus('当前浏览器不支持语音合成。');return}voices=synth.getVoices()||[];const spanish=voices.filter(v=>/^es([_-]|$)/i.test(v.lang));const target=spanish.filter(v=>matching(v,region.value));voice.replaceChildren();if(!target.length){let o=document.createElement('option');o.value='';o.textContent='没有检测到 '+region.value+' 语音';voice.append(o);$('voiceInfo').textContent='设备没有报告 '+region.value+' 语音。请尝试 iPhone 设置中的西语朗读声音，或切换另一口音。';}else{target.forEach(v=>{const o=document.createElement('option');o.value=String(voices.indexOf(v));o.textContent=v.name+' · '+v.lang+(v.localService?' · 本机':'');voice.append(o)});$('voiceInfo').textContent='找到 '+target.length+' 个 '+region.value+' 语音；可以逐个试听。'}sayStatus('检测到 '+spanish.length+' 个西语声音，其中当前口音 '+target.length+' 个。')}function play(slow=false){if(!synth){sayStatus('此浏览器不支持 speechSynthesis。');return}const idx=Number(voice.value),selected=voice.value!==''?voices[idx]:null;if(!selected||!matching(selected,region.value)){sayStatus('⚠️ 没有可用的 '+region.value+' 声音。未播放，以免使用错误口音。');return}const t=$('phrase').value.trim();if(!t){sayStatus('请先输入要试听的内容。');return}clearTimeout(timer);synth.cancel();const u=new SpeechSynthesisUtterance(t);u.voice=selected;u.lang=selected.lang;u.rate=slow?Math.max(.7,Number(rate.value)*.85):Number(rate.value);u.pitch=1;u.onstart=()=>sayStatus('▶ 正在播放：'+selected.name+' · '+selected.lang+' · '+u.rate.toFixed(2)+'×');u.onend=()=>sayStatus('✓ 播放结束：'+selected.name+' · '+u.rate.toFixed(2)+'×');u.onerror=e=>sayStatus('⚠️ 播放失败：'+e.error+'。可重新点击播放或刷新语音列表。');timer=setTimeout(()=>synth.speak(u),90)}function save(){try{localStorage.setItem('fresita-pronunciation-lab',JSON.stringify({region:region.value,rate:rate.value,notes:$('notes').value}))}catch(e){}}try{const v=JSON.parse(localStorage.getItem('fresita-pronunciation-lab')||'{}');if(['es-ES','es-MX'].includes(v.region))region.value=v.region;if(v.rate)rate.value=v.rate;if(v.notes)$('notes').value=v.notes}catch(e){}$('rateValue').textContent=Number(rate.value).toFixed(2)+'×';region.addEventListener('change',()=>{synth&&synth.cancel();refresh();save()});rate.addEventListener('input',()=>{$('rateValue').textContent=Number(rate.value).toFixed(2)+'×';save()});$('notes').addEventListener('input',save);$('refresh').addEventListener('click',refresh);$('play').addEventListener('click',()=>play(false));$('slow').addEventListener('click',()=>play(true));$('stop').addEventListener('click',()=>{clearTimeout(timer);synth&&synth.cancel();sayStatus('已停止。')});document.querySelectorAll('[data-phrase]').forEach(b=>b.addEventListener('click',()=>{$('phrase').value=b.dataset.phrase}));$('copy').addEventListener('click',async()=>{const v=voice.value!==''?voices[Number(voice.value)]:null;const report='Fresita 发音测试\n口音：'+region.value+'\n声音：'+(v?v.name:'未检测到')+'\n语速：'+rate.value+'×\n听感：'+$('notes').value;try{await navigator.clipboard.writeText(report);sayStatus('✓ 已复制测试结果')}catch(e){$('notes').value=report;sayStatus('无法自动复制，测试结果已写入下方文本框，请手动复制。')}});if(synth){refresh();if('onvoiceschanged'in synth)synth.addEventListener('voiceschanged',refresh);setTimeout(refresh,600);setTimeout(refresh,1800)}else sayStatus('此浏览器不支持语音合成。');})();
</script></body></html>
